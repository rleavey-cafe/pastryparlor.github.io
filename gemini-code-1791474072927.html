<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlor Cafe & Order Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#0F172A',
                            dark: '#0A0F1D',
                            light: '#1E293B',
                            accent: '#2563EB',
                            muted: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-navy text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-mug-hot text-2xl text-blue-400"></i>
                <h1 class="text-xl font-bold tracking-wide">THE PARLOR</h1>
            </div>
            <button onclick="toggleCartDrawer()" class="relative bg-navy-light border border-slate-700 px-4 py-2 rounded-xl flex items-center space-x-2 hover:bg-slate-700 transition">
                <i class="fa-solid fa-shopping-bag text-blue-400"></i>
                <span class="font-semibold text-sm">Cart</span>
                <span id="cart-badge" class="bg-blue-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Menu Section -->
        <section class="lg:col-span-2">
            <h2 class="text-2xl font-bold text-navy mb-6 border-b border-gray-200 pb-3">Menu Options</h2>
            <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamically Populated -->
            </div>
        </section>

        <!-- Sidebar Cart (Desktop View) -->
        <aside class="hidden lg:block bg-white border border-gray-200 rounded-2xl p-6 shadow-sm h-fit sticky top-24">
            <h2 class="text-lg font-bold text-navy mb-4 flex justify-between items-center">
                <span>Your Order</span>
                <i class="fa-solid fa-receipt text-slate-400"></i>
            </h2>
            <div id="desktop-cart-items" class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <!-- Cart Items Rendered Here -->
            </div>
            <div id="desktop-cart-summary" class="mt-6 border-t border-gray-100 pt-4 space-y-2">
                <!-- Totals Rendered Here -->
            </div>
        </aside>

    </main>

    <!-- Customization Modal -->
    <div id="item-modal" class="fixed inset-0 bg-navy-dark/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-gray-100">
            <!-- Modal Header -->
            <div class="bg-navy text-white p-5 flex justify-between items-start">
                <div>
                    <h3 id="modal-item-name" class="font-bold text-lg">Item Name</h3>
                    <p id="modal-item-price" class="text-blue-300 font-semibold text-sm">$0.00</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Modal Body (Dynamic Form Controls) -->
            <div id="modal-options-body" class="p-6 space-y-4 max-h-[60vh] overflow-y-auto">
                <!-- Dynamic Content Insertion -->
            </div>

            <!-- Modal Footer -->
            <div class="bg-gray-50 border-t border-gray-100 p-4 flex items-center justify-between">
                <!-- Qty Selector -->
                <div class="flex items-center space-x-3 bg-white border border-gray-300 rounded-xl px-3 py-1.5">
                    <button onclick="adjustModalQty(-1)" class="text-navy hover:text-blue-600 font-bold px-1 text-lg">-</button>
                    <span id="modal-qty" class="font-bold text-slate-800 min-w-[1.25rem] text-center">1</span>
                    <button onclick="adjustModalQty(1)" class="text-navy hover:text-blue-600 font-bold px-1 text-lg">+</button>
                </div>

                <button onclick="confirmAddToCart()" class="bg-navy hover:bg-navy-light text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-md">
                    Add to Cart
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 bg-navy-dark/70 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-6 shadow-2xl">
            <div>
                <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-4">
                    <h2 class="text-lg font-bold text-navy">Your Order</h2>
                    <button onclick="toggleCartDrawer()" class="text-slate-500 hover:text-navy">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <div id="mobile-cart-items" class="space-y-4 max-h-[65vh] overflow-y-auto">
                    <!-- Mobile Cart Items -->
                </div>
            </div>
            <div id="mobile-cart-summary" class="border-t border-gray-200 pt-4 space-y-2">
                <!-- Mobile Cart Summary -->
            </div>
        </div>
    </div>

    <script>
        // Data Definitions
        const MENU_DATA = [
            { id: '1', name: 'Signature Iced Tea', price: 3.50, customizable: true, type: 'iced_tea', desc: 'Fresh brewed black iced tea with flavor options.' },
            { id: '2', name: 'Custom Espresso Drink', price: 4.50, customizable: true, type: 'custom_drink', desc: 'Handcrafted espresso base with customizable milk and syrup.' },
            { id: '3', name: 'B.E.G. Bagel Sandwich', price: 6.50, customizable: true, type: 'beg_bagel', desc: 'Bacon, egg, and gouda cheese served hot on your choice of bagel.' },
            { id: '4', name: 'Avocado Toast', price: 7.00, customizable: true, type: 'avocado_toast', desc: 'Sourdough toast topped with fresh mashed avocado and seeds.' },
            { id: '5', name: 'Handcrafted Bagel', price: 3.00, customizable: true, type: 'hand_bagel', desc: 'Freshly baked daily with optional spreads.' },
            { id: '6', name: 'Breakfast Quesadilla', price: 8.00, customizable: true, type: 'quesadilla', desc: 'Crispy tortilla stuffed with scrambled eggs, cheddar, and salsa.' },
            { id: '7', name: 'Drip Coffee', price: 2.75, customizable: false, type: 'standard', desc: 'House roast medium roast coffee.' }
        ];

        const MILK_OPTIONS = ['Whole Milk', 'Oat Milk', 'Almond Milk', 'Skim Milk'];
        const FLAVOR_OPTIONS = ['None', 'Vanilla', 'Caramel', 'Hazelnut'];

        // State Management
        let cart = [];
        let activeModalItem = null;
        let activeModalQty = 1;

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            updateCartUI();
        });

        // Render Menu Items
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = MENU_DATA.map(item => `
                <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:border-slate-300 transition">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-navy text-base">${item.name}</h3>
                            <span class="font-bold text-navy bg-slate-100 px-2.5 py-1 rounded-lg text-sm">$${item.price.toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-slate-500 leading-relaxed mb-4">${item.desc}</p>
                    </div>
                    <button onclick="openCustomizationModal('${item.id}')" class="w-full bg-navy hover:bg-navy-light text-white font-semibold py-2 rounded-xl text-sm transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>${item.customizable ? 'Customize & Add' : 'Add to Cart'}</span>
                    </button>
                </div>
            `).join('');
        }

        // Open Modal and Render Appropriate Options Form
        function openCustomizationModal(itemId) {
            const item = MENU_DATA.find(i => i.id === itemId);
            if (!item) return;

            activeModalItem = item;
            activeModalQty = 1;

            document.getElementById('modal-item-name').innerText = item.name;
            document.getElementById('modal-item-price').innerText = `$${item.price.toFixed(2)}`;
            document.getElementById('modal-qty').innerText = '1';

            const body = document.getElementById('modal-options-body');
            body.innerHTML = '';

            if (!item.customizable) {
                body.innerHTML = `<p class="text-slate-500 text-sm italic">Standard recipe item. No additional customizations required.</p>`;
            } else if (item.type === 'iced_tea') {
                body.innerHTML = `
                    <div>
                        <label class="block font-bold text-xs uppercase text-navy mb-2">Sweetness / Flavor Choice</label>
                        <select id="modal-tea-flavor" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-navy">
                            <option value="Unsweetened">Unsweetened</option>
                            <option value="Dragonfruit Syrup">Dragonfruit Syrup</option>
                            <option value="Sweet Tea">Sweet Tea</option>
                        </select>
                    </div>
                `;
            } else if (item.type === 'custom_drink') {
                body.innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <label class="block font-bold text-xs uppercase text-navy mb-2">Milk Choice</label>
                            <select id="modal-milk" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-navy">
                                ${MILK_OPTIONS.map(m => `<option value="${m}">${m}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-xs uppercase text-navy mb-2">Flavor Syrup</label>
                            <select id="modal-flavor" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-navy">
                                ${FLAVOR_OPTIONS.map(f => `<option value="${f}">${f}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
            } else if (item.type === 'beg_bagel') {
                body.innerHTML = `
                    <div>
                        <label class="block font-bold text-xs uppercase text-navy mb-2">Bagel Selection</label>
                        <div class="space-y-2">
                            <label class="flex items-center space-x-2 text-sm cursor-pointer p-2 rounded-lg border border-gray-200 hover:bg-gray-50">
                                <input type="radio" name="modal-bagel-var" value="Plain Bagel" checked class="accent-navy">
                                <span>Plain Bagel</span>
                            </label>
                            <label class="flex items-center space-x-2 text-sm cursor-pointer p-2 rounded-lg border border-gray-200 hover:bg-gray-50">
                                <input type="radio" name="modal-bagel-var" value="Poppy Bagel" class="accent-navy">
                                <span>Poppy Bagel</span>
                            </label>
                            <label class="flex items-center space-x-2 text-sm cursor-pointer p-2 rounded-lg border border-gray-200 hover:bg-gray-50">
                                <input type="radio" name="modal-bagel-var" value="Everything Bagel" class="accent-navy">
                                <span>Everything Bagel</span>
                            </label>
                        </div>
                    </div>
                `;
            } else if (item.type === 'avocado_toast') {
                body.innerHTML = `
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="font-semibold text-sm text-navy">Add Extra Bacon</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-blue-600 font-bold">+$1.00</span>
                                <input type="checkbox" id="modal-add-bacon" class="w-4 h-4 accent-navy rounded">
                            </div>
                        </label>
                    </div>
                `;
            } else if (item.type === 'hand_bagel') {
                body.innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <label class="block font-bold text-xs uppercase text-navy mb-2">Bagel Variety</label>
                            <select id="modal-hand-var" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-navy">
                                <option value="Plain">Plain</option>
                                <option value="Poppy">Poppy</option>
                                <option value="Everything">Everything</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-xs uppercase text-navy mb-2">Add Spread Options</label>
                            <div class="space-y-2">
                                <label class="flex items-center justify-between cursor-pointer p-2 rounded-xl border border-gray-200 hover:bg-gray-50">
                                    <span class="text-sm">Cream Cheese</span>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs text-blue-600 font-bold">+$1.00</span>
                                        <input type="checkbox" id="modal-cc" class="w-4 h-4 accent-navy rounded">
                                    </div>
                                </label>
                                <label class="flex items-center justify-between cursor-pointer p-2 rounded-xl border border-gray-200 hover:bg-gray-50">
                                    <span class="text-sm">Butter</span>
                                    <div class="flex items-center justify-between space-x-2">
                                        <span class="text-xs text-blue-600 font-bold">+$1.00</span>
                                        <input type="checkbox" id="modal-butter" class="w-4 h-4 accent-navy rounded">
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                `;
            } else if (item.type === 'quesadilla') {
                body.innerHTML = `
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="font-semibold text-sm text-navy">Add Hot Sauce On Side</span>
                            <input type="checkbox" id="modal-hotsauce" class="w-4 h-4 accent-navy rounded">
                        </label>
                    </div>
                `;
            }

            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
            activeModalItem = null;
        }

        function adjustModalQty(delta) {
            activeModalQty += delta;
            if (activeModalQty < 1) activeModalQty = 1;
            document.getElementById('modal-qty').innerText = activeModalQty;
        }

        // Process Options and Push Item into Cart State
        function confirmAddToCart() {
            if (!activeModalItem) return;

            const item = activeModalItem;
            let calculatedPrice = item.price;
            let opts = [];

            if (item.type === 'iced_tea') {
                const teaChoice = document.getElementById('modal-tea-flavor')?.value;
                if (teaChoice) opts.push(teaChoice);
            } else if (item.type === 'custom_drink') {
                const milk = document.getElementById('modal-milk')?.value;
                const flavor = document.getElementById('modal-flavor')?.value;
                if (milk) opts.push(`Milk: ${milk}`);
                if (flavor && flavor !== 'None') opts.push(`Flavor: ${flavor}`);
            } else if (item.type === 'beg_bagel') {
                const bagelVar = document.querySelector('input[name="modal-bagel-var"]:checked')?.value;
                if (bagelVar) opts.push(bagelVar);
            } else if (item.type === 'avocado_toast') {
                const addBacon = document.getElementById('modal-add-bacon')?.checked;
                if (addBacon) {
                    opts.push('Add Bacon (+$1.00)');
                    calculatedPrice += 1.00;
                }
            } else if (item.type === 'hand_bagel') {
                const variety = document.getElementById('modal-hand-var')?.value;
                const cc = document.getElementById('modal-cc')?.checked;
                const butter = document.getElementById('modal-butter')?.checked;
                if (variety) opts.push(`Variety: ${variety}`);
                if (cc) {
                    opts.push('Cream Cheese (+$1.00)');
                    calculatedPrice += 1.00;
                }
                if (butter) {
                    opts.push('Butter (+$1.00)');
                    calculatedPrice += 1.00;
                }
            } else if (item.type === 'quesadilla') {
                const hotSauce = document.getElementById('modal-hotsauce')?.checked;
                if (hotSauce) opts.push('Add Hot Sauce');
            }

            const optionsString = opts.length > 0 ? opts.join(', ') : 'Standard Recipe';

            addToCart({
                id: item.id,
                name: item.name,
                unitPrice: calculatedPrice,
                qty: activeModalQty,
                options: optionsString
            });

            closeModal();
        }

        // Add to Cart Logic with Matching Options Signature
        function addToCart(newItem) {
            const existingIndex = cart.findIndex(
                ci => ci.id === newItem.id && ci.options === newItem.options
            );

            if (existingIndex > -1) {
                cart[existingIndex].qty += newItem.qty;
            } else {
                cart.push({
                    cartItemId: Date.now().toString() + Math.random().toString(36).substring(2, 5),
                    id: newItem.id,
                    name: newItem.name,
                    unitPrice: newItem.unitPrice,
                    qty: newItem.qty,
                    options: newItem.options
                });
            }

            updateCartUI();
        }

        function updateCartQty(cartItemId, delta) {
            const index = cart.findIndex(item => item.cartItemId === cartItemId);
            if (index > -1) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
            }
            updateCartUI();
        }

        // Render Cart Component for Mobile and Desktop
        function updateCartUI() {
            const totalItemCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const subtotal = cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);
            document.getElementById('cart-badge').innerText = totalItemCount;

            const renderCartList = () => {
                if (cart.length === 0) {
                    return `<p class="text-slate-400 text-sm text-center py-8">Your cart is currently empty.</p>`;
                }
                return cart.map(item => `
                    <div class="flex items-start justify-between bg-slate-50 border border-slate-200 p-3 rounded-xl">
                        <div class="pr-2">
                            <h4 class="font-bold text-navy text-sm">${item.name}</h4>
                            <p class="text-xs text-slate-500 font-medium mb-1">${item.options}</p>
                            <span class="text-xs text-blue-600 font-bold">$${(item.unitPrice * item.qty).toFixed(2)}</span>
                        </div>
                        <div class="flex items-center space-x-2 bg-white border border-gray-300 rounded-lg px-2 py-1">
                            <button onclick="updateCartQty('${item.cartItemId}', -1)" class="text-slate-600 hover:text-navy text-xs font-bold">-</button>
                            <span class="text-xs font-bold text-navy min-w-[1rem] text-center">${item.qty}</span>
                            <button onclick="updateCartQty('${item.cartItemId}', 1)" class="text-slate-600 hover:text-navy text-xs font-bold">+</button>
                        </div>
                    </div>
                `).join('');
            };

            const renderSummary = () => `
                <div class="flex justify-between items-center text-sm font-semibold text-navy">
                    <span>Total</span>
                    <span class="text-base font-bold text-blue-600">$${subtotal.toFixed(2)}</span>
                </div>
                <button ${cart.length === 0 ? 'disabled' : ''} class="w-full bg-navy hover:bg-navy-light text-white font-bold py-2.5 rounded-xl transition shadow disabled:opacity-50 disabled:cursor-not-allowed mt-2">
                    Checkout
                </button>
            `;

            document.getElementById('desktop-cart-items').innerHTML = renderCartList();
            document.getElementById('desktop-cart-summary').innerHTML = renderSummary();

            document.getElementById('mobile-cart-items').innerHTML = renderCartList();
            document.getElementById('mobile-cart-summary').innerHTML = renderSummary();
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
        }
    </script>
</body>
</html>
